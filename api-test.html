<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 4px; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>Bio-Design API Connection Test</h1>
    
    <div>
        <button onclick="testHealthCheck()">Test Health Check</button>
        <button onclick="testApiReady()">Test API Ready</button>
        <button onclick="testListSessions()">Test List Sessions</button>
        <button onclick="testSubmitReflection()">Test Submit Reflection</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        function displayResult(title, data, isError = false) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${isError ? 'error' : 'success'}`;
            resultDiv.innerHTML = `<h3>${title}</h3><div>${JSON.stringify(data, null, 2)}</div>`;
            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        async function makeApiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                return await response.json();
            } catch (error) {
                throw error;
            }
        }
        
        async function testHealthCheck() {
            try {
                const result = await makeApiCall('/health');
                displayResult('Health Check', result);
            } catch (error) {
                displayResult('Health Check Error', error.message, true);
            }
        }
        
        async function testApiReady() {
            try {
                const result = await makeApiCall('/api/v1/ready');
                displayResult('API Ready', result);
            } catch (error) {
                displayResult('API Ready Error', error.message, true);
            }
        }
        
        async function testListSessions() {
            try {
                const result = await makeApiCall('/api/v1/innovation/sessions');
                displayResult('List Sessions', result);
            } catch (error) {
                displayResult('List Sessions Error', error.message, true);
            }
        }
        
        async function testSubmitReflection() {
            try {
                const requestData = {
                    query: "Test reflection query from frontend",
                    max_rounds: 3
                };
                
                const result = await makeApiCall('/api/v1/reflection/start', {
                    method: 'POST',
                    body: JSON.stringify(requestData)
                });
                displayResult('Submit Reflection', result);
            } catch (error) {
                displayResult('Submit Reflection Error', error.message, true);
            }
        }
        
        // Auto-run health check on page load
        window.onload = function() {
            testHealthCheck();
        };
    </script>
</body>
</html>
