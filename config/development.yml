# Development environment configuration
debug: true
log_level: DEBUG
database_url: postgresql://user:password@localhost:5432/biodesign_dev
redis_url: redis://localhost:6379/0

# API settings
cors_origins:
  - http://localhost:3000
  - http://localhost:5173
  - http://127.0.0.1:3000

# LLM settings
openai:
  model: gpt-4-turbo-preview
  temperature: 0.7
  max_tokens: 2000

anthropic:
  model: claude-3-sonnet-20240229
  temperature: 0.7
  max_tokens: 2000

# Debate settings
debate:
  max_rounds: 10
  consensus_threshold: 0.8
  timeout_seconds: 1800
