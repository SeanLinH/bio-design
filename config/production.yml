# Production environment configuration
debug: false
log_level: INFO
database_url: ${DATABASE_URL}
redis_url: ${REDIS_URL}

# API settings
cors_origins:
  - https://biodesign.yourdomain.com
  - https://app.yourdomain.com

# LLM settings
openai:
  model: gpt-4-turbo-preview
  temperature: 0.5
  max_tokens: 1500

anthropic:
  model: claude-3-sonnet-20240229
  temperature: 0.5
  max_tokens: 1500

# Debate settings
debate:
  max_rounds: 8
  consensus_threshold: 0.85
  timeout_seconds: 1200

# Security
rate_limiting:
  requests_per_minute: 60
  burst: 10
